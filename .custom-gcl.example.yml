# Config for building custom golangci-lint with loglint (Module Plugin).
# Copy to your project as .custom-gcl.yml and run: golangci-lint custom
#
# Add to .gitignore: custom-gcl

version: v2.11.3  # Must match: golangci-lint version

plugins:
  # Remote (from GitHub)
  - module: github.com/loglint/loglint
    import: github.com/loglint/loglint/plugin/module
    version: v1.0.0

  # Or local
  # - module: github.com/loglint/loglint
  #   path: /path/to/loglint
  #   import: github.com/loglint/loglint/plugin/module
